[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vmbmk"
version = "0.2.0"
description = "Minimal value-model inference core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=5.4"]

[project.scripts]
vmbmk = "vmbmk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

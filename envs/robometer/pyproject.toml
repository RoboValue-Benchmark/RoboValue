[project]
name = "vmbmk-robometer-runtime"
version = "0.1.0"
description = "Pinned minimal inference runtime for Robometer on Jscloud"
requires-python = "==3.10.*"
dependencies = [
  "accelerate==1.9.0",
  "av==17.1.0",
  "codetiming==1.4.0",
  "datasets==4.1.1",
  "einops==0.8.2",
  "fastapi==0.116.1",
  "huggingface-hub[hf-xet]==0.36.2",
  "hydra-core==1.3.2",
  "loguru==0.7.3",
  "matplotlib==3.10.9",
  "numpy==2.2.6",
  "omegaconf==2.3.0",
  "opencv-python-headless==4.12.0.88",
  "peft==0.19.1",
  "pillow==11.3.0",
  "pyrallis==0.3.1",
  "pyyaml==6.0.3",
  "qwen-vl-utils==0.0.14",
  "rich==15.0.0",
  "safetensors==0.8.0",
  "sentence-transformers==5.6.1",
  "tensorboard==2.21.0",
  "torch==2.8.0",
  "torchao==0.13.0",
  "torchvision==0.23.0",
  "transformers==4.57.2",
  "trl==0.20.0",
  "unsloth==2025.10.11",
  "unsloth-zoo==2025.10.12",
  "uvicorn==0.35.0",
  "wandb==0.20.1",
  "xformers==0.0.32.post2",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

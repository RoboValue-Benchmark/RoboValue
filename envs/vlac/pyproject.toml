[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-vlac"
version = "1.0.0"
description = "VLAC: A Vision-Language-Action-Critic Model for Robotic Real-World Reinforcement Learning"
readme = "README.md"
authors = [{ name = "zhangqi", email = "zhangqi1@pjlab.org" }]
license = "Apache-2.0"
requires-python = "==3.10.*"
dependencies = [
    "av==17.1.0",
    "distro==1.9.0",
    "flash-attn==2.8.3.post1",
    "loguru==0.7.3",
    "matplotlib==3.10.9",
    "ms-swift==3.3.0",
    "numpy==1.26.4",
    "ninja==1.13.0",
    "opencv-python==4.11.0.86",
    "pandas==2.3.3",
    "peft==0.15.2",
    "pillow==12.3.0",
    "requests==2.34.2",
    "scipy==1.15.3",
    "sentencepiece==0.1.99",
    "timm==1.0.28",
    "tiktoken==0.13.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm==4.70.0",
    "transformers==4.51.3",
    "wheel==0.48.0",
]

[project.urls]
Homepage = "https://github.com/7-Z-7/VLAC"
Repository = "https://github.com/7-Z-7/VLAC"

[tool.setuptools.packages.find]
include = ["evo_vlac*"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
constraint-dependencies = [
    "aliyun-python-sdk-core==2.16.0",
    "filelock==3.32.3",
    "httpcore2==2.10.0",
    "httpx2==2.10.0",
    "idna==3.18",
    "jmespath==0.10.0",
    "openai==3.1.0",
    "protobuf==7.35.1",
    "pygments==2.20.0",
    "uvicorn==0.52.3",
    "xxhash==4.0.0",
]

[tool.uv.sources]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1%2Bcu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

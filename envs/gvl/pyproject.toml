[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vmbmk-gvl-environment"
version = "0.1.0"
description = "Locked runtime for the VMBMK GVL baseline"
requires-python = "==3.10.*"
dependencies = [
    "av==17.1.0",
    "accelerate==1.10.1",
    "gvl-baseline[qwen,video,test]",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.1",
]

[tool.setuptools]
packages = []

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
gvl-baseline = { path = "../../../vmbmk/baselines/GVL", editable = true }

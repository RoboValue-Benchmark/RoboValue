[project]
name = "vmbmk-robodopamine-runtime"
version = "0.1.0"
description = "Pinned Robo-Dopamine inference runtime for VMBMK on Jscloud"
requires-python = "==3.10.*"
dependencies = [
  "cloudpickle==3.1.1",
  "dill==0.4.0",
  "fastapi==0.116.1",
  "frozendict==2.4.6",
  "fsspec==2025.9.0",
  "jiter==0.10.0",
  "jsonschema==4.25.1",
  "msgpack==1.1.1",
  "numpy==2.2.6",
  "openai==1.109.1",
  "opencv-python-headless==4.12.0.88",
  "pillow==11.3.0",
  "prometheus-fastapi-instrumentator==7.1.0",
  "protobuf==6.33.6",
  "pycountry==24.6.1",
  "pydantic==2.13.4",
  "pydantic-extra-types==2.10.6",
  "pyyaml==6.0.3",
  "qwen-vl-utils==0.0.14",
  "ray==2.57.0",
  "referencing==0.36.2",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.0",
  "rpds-py==0.27.1",
  "uvicorn==0.35.0",
  "vllm==0.11.0",
  "xformers==0.0.32.post1",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
